# Install once: copy to /etc/nginx/conf.d/cors-geeta-map.conf
#   sudo cp nginx-cors-map.conf /etc/nginx/conf.d/cors-geeta-map.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is loaded in the http { } context (required for map).

map $http_origin $cors_allow_origin {
    default "";
    "~^https://geetaprinters\.in$" $http_origin;
    "~^https://www\.geetaprinters\.in$" $http_origin;
    "~^https://[a-z0-9-]+\.geetaprinters\.in$" $http_origin;
    "http://localhost:3000" $http_origin;
    "http://127.0.0.1:3000" $http_origin;
}

map $http_origin $cors_allow_credentials {
    default "";
    "~^https://(.+\.)?geetaprinters\.in$" "true";
    "http://localhost:3000" "true";
    "http://127.0.0.1:3000" "true";
}
