# See api.geetaprinters.in.conf for the full site config (100 MB uploads + CORS).
# See nginx-cors-map.conf for the CORS map file (install in /etc/nginx/conf.d/).
#
# Quick install on Ubuntu API server:
#
#   cd /path/to/geeta-backend/deploy
#   sudo cp nginx-cors-map.conf /etc/nginx/conf.d/cors-geeta-map.conf
#   sudo cp api.geetaprinters.in.conf /etc/nginx/sites-available/api.geetaprinters.in
#   sudo ln -sf /etc/nginx/sites-available/api.geetaprinters.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify upload limit:
#   curl -I https://api.geetaprinters.in/health -H "Origin: https://www.geetaprinters.in"
