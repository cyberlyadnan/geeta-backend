# /etc/nginx/sites-available/api.geetaprinters.in
#
# Install CORS map first (one-time):
#   sudo cp nginx-cors-map.conf /etc/nginx/conf.d/cors-geeta-map.conf
# Then:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name api.geetaprinters.in;

    # Allow large artwork uploads (fixes 413)
    client_max_body_size 100m;
    client_body_timeout 600s;
    client_body_buffer_size 128k;

    # SSL — Certbot
    ssl_certificate /etc/letsencrypt/live/api.geetaprinters.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.geetaprinters.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {

        # CORS — $cors_allow_origin from /etc/nginx/conf.d/cors-geeta-map.conf
        # Allows www + apex + subdomains of geetaprinters.in
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials $cors_allow_credentials always;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Request-ID" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;

        # Preflight — X-Request-ID is required (frontend sends it on every API call)
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            add_header Access-Control-Allow-Credentials $cors_allow_credentials always;
            add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Request-ID" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0 always;
            add_header Content-Type text/plain always;
            return 204;
        }

        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_request_buffering off;
    }
}

server {
    listen 80;
    server_name api.geetaprinters.in;

    return 301 https://$host$request_uri;
}
